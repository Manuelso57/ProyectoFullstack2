<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Pasteleria mil sabores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/stile.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="imagenes/logo.png" alt="Logo Mil Sabores" class="logo-imagen">
                <a href="index.html">Pastelería Mil Sabores</a>
            </div>
            <div class="enlaces">
                <ul class="menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blogs.html">Blogs</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
                <div class="acciones">
                    <a href="login.html">Iniciar sesión</a>
                    <a href="registro.html">Registrarse</a>
                    <a href="carrito.html">Carrito (<span id="contador_carrito">0</span>)</a>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="seccion-titulo">
            <h1>Crear cuenta</h1>
            <p>Mayores de 50 años reciben 50% de descuento automático.</p>
        </section>

        <section class="contenedor-formulario">
            <form id="form-registro" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" maxlength="50">
                    <p class="error-mensaje"></p>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" maxlength="100">
                    <p class="error-mensaje"></p>
                </div>

                <div class="campo">
                    <label for="run">RUN</label>
                    <input type="text" id="run" name="run" maxlength="9" placeholder="19011022K">
                    <p class="error-mensaje"></p>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" maxlength="100" placeholder="nombre@duoc.cl">
                    <p class="error-mensaje"></p>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password">
                    <p class="error-mensaje"></p>
                </div>

                <div class="campo">
                    <label for="confirmar-password">Confirmar contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar-password">
                    <p class="error-mensaje"></p>
                </div>

                <div class="campo">
                    <label for="fecha-nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
                    <p class="error-mensaje"></p>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono (opcional)</label>
                    <input type="tel" id="telefono" name="telefono" maxlength="15">
                    <p class="error-mensaje"></p>
                </div>

                <div class="fila-doble">
                    <div class="campo">
                        <label for="region">Región</label>
                        <input type="text" id="region" name="region" maxlength="100">
                        <p class="error-mensaje"></p>
                    </div>

                    <div class="campo">
                        <label for="comuna">Comuna</label>
                        <input type="text" id="comuna" name="comuna" maxlength="100">
                        <p class="error-mensaje"></p>
                    </div>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" maxlength="300">
                    <p class="error-mensaje"></p>
                </div>

                <div class="campo">
                    <label for="codigo-descuento">Código de descuento (opcional)</label>
                    <input type="text" id="codigo-descuento" name="codigo-descuento" maxlength="20" placeholder="FELICES50">
                    <p class="error-mensaje"></p>
                </div>

                <button type="submit" class="boton">Registrarme</button>
                <p class="mensaje-formulario" role="status"></p>
            </form>
        </section>
    </main>
    <footer class="pie-pagina pie-pagina--simple">
        <p>Pastelería Mil Sabores</p>
    </footer>
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/registro_pagina.js"></script>
</body>

</html>

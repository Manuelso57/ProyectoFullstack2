<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torta Cuadrada de Chocolate - Pasteleria mil sabores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/stile.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="imagenes/logo.png" alt="Logo Mil Sabores" class="logo-imagen">
                <a href="index.html">Pastelería Mil Sabores</a>
            </div>
            <div class="enlaces">
                <ul class="menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blogs.html">Blogs</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
                <div class="acciones">
                    <a href="login.html">Iniciar sesión</a>
                    <a href="registro.html">Registrarse</a>
                    <a href="carrito.html">Carrito (<span id="contador_carrito">0</span>)</a>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="detalle-producto">
            <div class="detalle-producto__imagen">
                <img id="detalle-imagen" src="" alt="">
            </div>
            <div class="detalle-producto__info">
                <span class="detalle-producto__categoria" id="detalle-categoria"></span>
                <h1 id="detalle-nombre"></h1>
                <p class="detalle-producto__precio" id="detalle-precio"></p>
                <p id="detalle-descripcion"></p>
                <div class="selector-cantidad">
                    <button type="button" id="restar-cantidad" class="selector-cantidad__boton">−</button>
                    <input type="number" id="valor-cantidad" value="1" min="1" class="selector-cantidad__valor">
                    <button type="button" id="sumar-cantidad" class="selector-cantidad__boton">+</button>
                </div>
                <button type="button" id="agregar_carrito" class="boton">Añadir al carrito</button>
                <a href="productos.html" class="boton_volver">Volver</a>
            </div>
        </section>
    </main>
    <footer class="pie-pagina pie-pagina--simple">
        <p>Pastelería Mil Sabores</p>
    </footer>
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/detalle_producto.js"></script>
</body>
</html>
